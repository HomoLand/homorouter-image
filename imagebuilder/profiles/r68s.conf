# Declarative ImmortalWrt 25.12.2 (6.12.103 LTS, fw4, apk) rockchip/armv8 profile
# Target device:
#   - Lunzn FastRhino R68S (RK3568, 2x GMAC + 2x RTL8125 via device_packages kmod-r8125, eMMC)
#
# Notes:
#   - Official adguardhome apk is intentionally excluded to avoid path/init/jail
#     conflicts with custom /opt/AdGuardHome binary deployments. Pass --adguard-bin
#     to imagebuilder/build.sh to pre-embed /opt/AdGuardHome/AdGuardHome in /rom.
#   - Cross-firmware sysupgrade from QWRT (board_name: fastrhino,r68s) to
#     ImmortalWrt (lunzn_fastrhino-r68s) requires verifying board compatibility.

IMMORTALWRT_RELEASE="25.12.2"
IMMORTALWRT_KERNEL="6.12.103"
IMMORTALWRT_TARGET="rockchip"
IMMORTALWRT_SUBTARGET="armv8"
IMMORTALWRT_PROFILE="lunzn_fastrhino-r68s"

IMAGEBUILDER_ARCHIVE="immortalwrt-imagebuilder-25.12.2-rockchip-armv8.Linux-x86_64.tar.zst"
IMAGEBUILDER_URL="https://downloads.immortalwrt.org/releases/25.12.2/targets/rockchip/armv8/immortalwrt-imagebuilder-25.12.2-rockchip-armv8.Linux-x86_64.tar.zst"
IMAGEBUILDER_SHA256="089862cb214e3a738a67fa02156489f4a0f71ea20b79c332f7e63443498de471"

# Keep rockchip default boot/kernel layout; expand overlay to 1 GiB.
KERNEL_PARTSIZE=""
ROOTFS_PARTSIZE="1024"
DISABLE_KCONFIG=""

EXPECTED_IMAGE_GLOB="*lunzn_fastrhino-r68s-squashfs-sysupgrade.img.gz"

PACKAGES="
  firewall4
  dnsmasq-full
  kmod-nft-fullcone
  kmod-nft-tproxy
  kmod-nft-socket
  kmod-nft-offload
  kmod-inet-diag
  kmod-tun
  miniupnpd-nftables
  luci
  luci-ssl-openssl
  luci-compat
  luci-i18n-base-zh-cn
  luci-i18n-firewall-zh-cn
  luci-app-openclash
  luci-app-ddns
  luci-i18n-ddns-zh-cn
  luci-app-upnp
  luci-i18n-upnp-zh-cn
  ruby
  ruby-yaml
  ruby-digest
  ruby-date
  ruby-stringio
  ruby-bigdecimal
  ruby-pstore
  ruby-enc
  ddns-scripts
  ddns-scripts-cloudflare
  tailscale
  sqm-scripts
  coreutils-stat
  coreutils-timeout
  coreutils-nohup
  coreutils-base64
  lua
  bash
  curl
  ca-bundle
  ip-full
  flock
  jq
  jsonfilter
  unzip
  ethtool-full
  openssh-sftp-server
  lsblk
  parted
  resize2fs
"

REQUIRED_AUDIT_PACKAGES="
  kmod-r8125
  firewall4
  dnsmasq-full
  kmod-nft-fullcone
  kmod-nft-tproxy
  kmod-nft-socket
  kmod-nft-offload
  kmod-inet-diag
  kmod-tun
  miniupnpd-nftables
  luci-ssl-openssl
  luci-app-openclash
  ruby
  ruby-yaml
  ddns-scripts-cloudflare
  tailscale
  sqm-scripts
  coreutils-stat
  lua
  bash
"

FORBIDDEN_PACKAGES="
  adguardhome
  miniupnpd-iptables
  luci-app-ipsec-vpnd
  luci-app-openvpn-server
  luci-proto-openvpnc
  strongswan
  strongswan-charon
  strongswan-ipsec
  openvpn-openssl
  openvpn-easy-rsa
  vlmcsd
"
