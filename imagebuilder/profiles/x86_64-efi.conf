# Declarative ImmortalWrt 25.12.2 (6.12.103 LTS, fw4, apk) x86/64 EFI profile
# Unified x86_64 EFI image supporting common homelab soft-router NICs & storage:
#   - Intel N100 / N5105 / J4105 (I226-V igc, RTL8111/8168 r8168, ConnectX-3 mlx4)
#   - NVMe / eMMC / SATA AHCI
#
# Notes:
#   - Official adguardhome apk is intentionally excluded to avoid path/init/jail
#     conflicts with custom /opt/AdGuardHome binary deployments. Pass --adguard-bin
#     to imagebuilder/build.sh to pre-embed /opt/AdGuardHome/AdGuardHome in /rom.
#   - kmod-r8169 is intentionally excluded because 25.12.2 x86/64 default_packages
#     already bundles kmod-r8168 (mixing both causes driver contention).

IMMORTALWRT_RELEASE="25.12.2"
IMMORTALWRT_KERNEL="6.12.103"
IMMORTALWRT_TARGET="x86"
IMMORTALWRT_SUBTARGET="64"
IMMORTALWRT_PROFILE="generic"

IMAGEBUILDER_ARCHIVE="immortalwrt-imagebuilder-25.12.2-x86-64.Linux-x86_64.tar.zst"
IMAGEBUILDER_URL="https://downloads.immortalwrt.org/releases/25.12.2/targets/x86/64/immortalwrt-imagebuilder-25.12.2-x86-64.Linux-x86_64.tar.zst"
IMAGEBUILDER_SHA256="b9b290f5ef60a22bccd5bdca9c1e7523b8fc84e60462afbf550e20db94acf2c6"

# 128 MiB /boot (eliminates 56 MiB sysupgrade.tgz space limit) and 1 GiB overlay.
KERNEL_PARTSIZE="128"
ROOTFS_PARTSIZE="1024"

# Disable optional VM/ISO image formats so x86/64 builds do not require
# qemu-img or mkisofs and always reach Image/Manifest cleanly.
DISABLE_KCONFIG="
  CONFIG_ISO_IMAGES
  CONFIG_QCOW2_IMAGES
  CONFIG_VDI_IMAGES
  CONFIG_VMDK_IMAGES
  CONFIG_VHDX_IMAGES
"

EXPECTED_IMAGE_GLOB="*x86-64-generic-squashfs-combined-efi.img.gz"

PACKAGES="
  kmod-mlx4-core
  firewall4
  dnsmasq-full
  kmod-nft-fullcone
  kmod-nft-tproxy
  kmod-nft-socket
  kmod-nft-offload
  kmod-inet-diag
  kmod-tun
  miniupnpd-nftables
  luci
  luci-ssl-openssl
  luci-compat
  luci-i18n-base-zh-cn
  luci-i18n-firewall-zh-cn
  luci-app-openclash
  luci-app-ddns
  luci-i18n-ddns-zh-cn
  luci-app-upnp
  luci-i18n-upnp-zh-cn
  ruby
  ruby-yaml
  ruby-digest
  ruby-date
  ruby-stringio
  ruby-bigdecimal
  ruby-pstore
  ruby-enc
  ddns-scripts
  ddns-scripts-cloudflare
  tailscale
  sqm-scripts
  coreutils-stat
  coreutils-timeout
  coreutils-nohup
  coreutils-base64
  lua
  bash
  curl
  ca-bundle
  ip-full
  flock
  jq
  jsonfilter
  unzip
  ethtool-full
  openssh-sftp-server
  lsblk
  parted
  resize2fs
"

REQUIRED_AUDIT_PACKAGES="
  kmod-mlx4-core
  firewall4
  dnsmasq-full
  kmod-nft-fullcone
  kmod-nft-tproxy
  kmod-nft-socket
  kmod-nft-offload
  kmod-inet-diag
  kmod-tun
  miniupnpd-nftables
  luci-ssl-openssl
  luci-app-openclash
  ruby
  ruby-yaml
  ddns-scripts-cloudflare
  tailscale
  sqm-scripts
  coreutils-stat
